services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buildable
      POSTGRES_USER: buildable
      POSTGRES_PASSWORD: buildable
    ports:
      - "5432:5432"
    volumes:
      - buildable-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildable -d buildable"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: devops/api.Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://buildable:buildable@postgres:5432/buildable
      SECRET_KEY: local-compose-secret-change-before-production
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      COOKIE_SECURE: "false"
      RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: devops/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  buildable-postgres:
